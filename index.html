<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>诡镇奇谭：卡牌版 · 基础单场景</title>
<style>
:root{
  --bg:#0a0706; --panel:#17110c; --panel2:#201812; --border:#3a2c1e;
  --gold:#c9a35a; --gold-dim:#8a6d3a; --blood:#a33; --blood-dim:#5c1f1f;
  --text:#eadfbe; --dim:#a2906c; --green:#5c8a4a; --blue:#4a6a8a; --purple:#7a4a8a;
  --will:#6a5a9a; --int:#4a7a8a; --combat:#a34a4a; --agility:#5a8a5a;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--text);
  font-family:"Georgia","Songti SC","SimSun",serif;
  background-image:
    radial-gradient(ellipse at 50% -10%, #241a10 0%, transparent 55%),
    repeating-linear-gradient(45deg, rgba(0,0,0,.15) 0 2px, transparent 2px 6px);
  background-attachment:fixed;
}
/* ===== 顶栏 ===== */
.topbar{display:flex;align-items:center;justify-content:space-between;max-width:1400px;margin:0 auto;padding:10px 16px 4px}
.brand{font-size:20px;color:var(--gold);letter-spacing:3px;text-shadow:0 0 14px rgba(201,163,90,.45);font-weight:bold}
.brand small{display:block;font-size:10px;color:var(--dim);letter-spacing:1px;font-weight:normal}
.topstats{display:flex;gap:14px;font-size:13px;color:var(--dim);align-items:center}
.topstats b{color:var(--gold);font-size:15px}
.topstats .pill{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:4px 12px}
/* ===== 阶段条 ===== */
#wrap{max-width:1400px;margin:0 auto;padding:0 16px 16px}
.phasebar{display:flex;gap:6px;margin:10px 0 12px}
.phase{flex:1;text-align:center;padding:7px 4px;border:1px solid var(--border);border-radius:6px;color:var(--dim);font-size:11px;background:var(--panel);position:relative;transition:all .2s}
.phase.active{border-color:var(--gold);color:var(--gold);box-shadow:0 0 12px rgba(201,163,90,.3);background:var(--panel2)}
.phase .nm{font-weight:bold;font-size:13px;letter-spacing:1px}
.phase .en{font-size:9px;opacity:.6;letter-spacing:1px}
.phase.active::after{content:'';position:absolute;bottom:-1px;left:20%;right:20%;height:2px;background:var(--gold)}
/* ===== 主布局 ===== */
.main{display:grid;grid-template-columns:250px 1fr 280px;gap:12px;align-items:start}
@media(max-width:980px){.main{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:12px}
.panel h2{font-size:13px;color:var(--gold);border-bottom:1px solid var(--border);padding-bottom:6px;margin-bottom:10px;letter-spacing:2px;display:flex;align-items:center;justify-content:space-between}
.panel h2 .cnt{font-size:10px;color:var(--dim);letter-spacing:0}
/* ===== 调查员卡（左栏）===== */
.inv-card{cursor:pointer;transition:border-color .15s}
.inv-card:hover{border-color:var(--gold)}
.inv-card .inv-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.inv-card .avatar{width:46px;height:46px;border-radius:50%;border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:22px;background:radial-gradient(circle,#2a1c10,#1a1008);flex-shrink:0}
.inv-card .nm{font-size:15px;font-weight:bold}
.inv-card .tt{font-size:10px;color:var(--dim)}
.inv-card .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:10px}
.inv-card .stat{border:1px solid var(--border);border-radius:6px;padding:5px 2px;text-align:center;font-size:10px;color:var(--dim);background:var(--panel2)}
.inv-card .stat .v{font-weight:bold;font-size:16px;display:block;margin-top:2px}
.inv-card .stat.will .v{color:#b0a0e0}.inv-card .stat.int .v{color:#7ab0c8}.inv-card .stat.combat .v{color:#d08080}.inv-card .stat.agility .v{color:#90c090}
.gauge{margin-bottom:8px}
.gauge .grow{display:flex;justify-content:space-between;font-size:11px;margin-bottom:3px}
.gauge .grow span:first-child{color:var(--dim)}
.gauge .grow b{color:var(--text)}
.gauge .bar{height:9px;border:1px solid var(--border);border-radius:5px;overflow:hidden;background:#0a0705}
.gauge .fill{height:100%;transition:width .3s}
.fill.hp{background:linear-gradient(90deg,#6d1f1f,#a33)}
.fill.sanity{background:linear-gradient(90deg,#2a3d55,#4a6a8a)}
.resources-line{display:flex;gap:10px;font-size:12px;border-top:1px solid var(--border);padding-top:8px;margin-top:4px}
.resources-line b{color:var(--gold)}
.inv-hint{text-align:center;font-size:9px;color:var(--dim);margin-top:6px;opacity:.7}
/* ===== 幕/议程 ===== */
.aa{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.aa .side{border:1px solid var(--border);border-radius:6px;padding:8px;background:var(--panel2)}
.aa .side.agenda{border-color:var(--blood-dim)}
.aa .side.act{border-color:#3a4a2a}
.aa h3{font-size:11px;color:var(--gold);margin-bottom:4px;letter-spacing:1px}
.aa .txt{font-size:10px;color:var(--dim);line-height:1.5}
.doom{color:#e08080;font-weight:bold}
/* ===== 地点（中央大地图）===== */
.locs{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.loc{border:1px solid var(--border);border-radius:8px;padding:12px;background:linear-gradient(160deg,var(--panel2),#150f0a);position:relative;min-height:130px}
.loc.current{border-color:var(--gold);box-shadow:0 0 16px rgba(201,163,90,.35)}
.loc.current::before{content:'📍 你在这里';position:absolute;top:-10px;left:10px;background:var(--gold);color:#1a1008;font-size:9px;padding:2px 8px;border-radius:8px;font-weight:bold;letter-spacing:1px}
.loc .lname{font-weight:bold;font-size:15px;color:var(--gold)}
.loc.unrevealed{filter:grayscale(.4);opacity:.85}
.loc .linfo{font-size:10px;color:var(--dim);margin-top:6px;line-height:1.5}
.loc .tags{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.loc .tag{font-size:9px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:2px 8px;color:var(--dim)}
.loc .tag.shroud{color:#c9b0e0}
.loc .tag.clue{color:#e8c860}
.loc .tag.enemy{color:#e08080;border-color:var(--blood-dim)}
.loc .conn{font-size:9px;color:var(--dim);margin-top:8px;border-top:1px dotted var(--border);padding-top:6px}
/* ===== 地图视图 ===== */
.map-wrap{position:relative;background:radial-gradient(ellipse at 50% 50%, rgba(60,40,20,.25), transparent 70%)}
.map{position:relative;min-height:470px}
.map svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.map-link{stroke:var(--gold-dim);stroke-width:2;stroke-dasharray:6 5;opacity:.5}
.map-node{position:absolute;transform:translate(-50%,-50%);cursor:pointer;text-align:center;width:96px;z-index:2}
.map-node .node-card{border:1px solid var(--border);border-radius:11px;padding:8px 6px;background:linear-gradient(160deg,var(--panel2),#150f0a);transition:all .15s;display:flex;flex-direction:column;align-items:center;gap:2px}
.map-node .node-ico{font-size:22px;line-height:1;display:block;width:26px;height:26px;color:var(--gold);margin:0 auto}
.map-node .node-ico svg{width:26px;height:26px;display:block}
.map-node.current .node-ico{color:#f0d58a}
.map-node .node-name{font-weight:bold;font-size:12.5px;color:var(--text);line-height:1.2;white-space:nowrap}
.map-node .node-sub{font-size:8.5px;color:var(--dim);line-height:1.2}
.map-node .node-clue{font-size:9.5px;color:#e8c860;line-height:1.2;display:block}
.map-node .node-enemy{font-size:9.5px;color:#e08080;line-height:1.2;display:block}
.map-node.current .node-card{border-color:var(--gold);box-shadow:0 0 22px rgba(201,163,90,.6);animation:pulse 2s infinite}
.map-node.current .node-name{color:var(--gold)}
.map-node.reachable .node-card{border-color:var(--green);border-style:dashed}
.map-node.reachable:hover .node-card{border-color:var(--gold);transform:scale(1.06)}
.map-node.unrevealed .node-card{filter:grayscale(.5);opacity:.8}
.map-node.unrevealed .node-name{color:var(--dim)}
.map-node .you{position:absolute;top:-11px;left:50%;transform:translateX(-50%);background:var(--gold);color:#1a1008;font-size:8px;padding:1px 8px;border-radius:8px;font-weight:bold;letter-spacing:1px;white-space:nowrap}
@keyframes pulse{0%,100%{box-shadow:0 0 12px rgba(201,163,90,.5)}50%{box-shadow:0 0 26px rgba(201,163,90,.85)}}
.map-node.unrevealed{cursor:not-allowed}
.move-btn{display:flex;align-items:center;gap:8px}
.move-ico{width:20px;height:20px;color:var(--gold);flex-shrink:0;display:inline-block}
.move-ico svg{width:20px;height:20px;display:block}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:9px;color:var(--dim);margin-top:8px;padding-top:8px;border-top:1px dotted var(--border)}
.legend span{display:flex;align-items:center;gap:4px}
.legend .dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.legend .dot.cur{background:var(--gold)}.legend .dot.reach{background:var(--green)}.legend .dot.unr{background:var(--dim)}
/* ===== 敌人 ===== */
.enemy{border:1px solid var(--blood-dim);border-radius:8px;padding:10px;background:linear-gradient(160deg,#1a0f0f,#120a0a);font-size:11px;margin-bottom:8px;display:flex;align-items:center;gap:10px}
.enemy .e-ico{width:38px;height:38px;border-radius:8px;background:#241010;border:1px solid var(--blood-dim);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.enemy .e-info{flex:1}
.enemy .ename{color:#e0a0a0;font-weight:bold;font-size:12px}
.enemy .ename .st{font-size:9px;color:var(--dim);font-weight:normal;margin-left:4px}
.enemy .estats{color:var(--dim);font-size:10px;margin-top:3px;line-height:1.5}
.enemy .estats b{color:var(--text)}
.enemy.exhausted{opacity:.55}
/* ===== 行动 ===== */
.actions{display:flex;flex-wrap:wrap;gap:6px}
.action-btn{min-width:96px;text-align:left;position:relative}
.action-btn small{display:block;font-size:9px;color:var(--dim);letter-spacing:0;margin-top:2px}
#controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center;border-top:1px solid var(--border);padding-top:10px}
/* ===== 事件记录（右栏）===== */
.log-panel{position:sticky;top:12px}
#log{max-height:560px;overflow-y:auto;font-size:11px;line-height:1.55;color:var(--dim);padding-right:4px}
#log .narr{color:var(--text);font-style:italic}
#log .good{color:#90c090}#log .bad{color:#e08080}#log .gold{color:var(--gold)}
#log div{padding:3px 0;border-bottom:1px solid #1c1610}
#log::-webkit-scrollbar{width:6px}
#log::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
/* ===== 底部手牌 ===== */
.bottom{display:grid;grid-template-columns:1fr;gap:12px}
.hand{display:flex;flex-wrap:wrap;gap:8px;min-height:130px}
.card{width:118px;min-height:150px;border:1px solid var(--border);border-radius:8px;padding:8px;font-size:10px;background:var(--panel2);cursor:pointer;transition:transform .12s,border-color .12s,box-shadow .12s;position:relative;display:flex;flex-direction:column}
.card:hover{transform:translateY(-5px);border-color:var(--gold);box-shadow:0 6px 16px rgba(0,0,0,.5)}
.card .ctype{font-size:8px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;margin-bottom:3px}
.card .ccost{position:absolute;top:6px;right:8px;color:var(--gold);font-weight:bold;font-size:13px}
.card .cname{font-weight:bold;font-size:12px;color:var(--text);margin-bottom:5px;padding-right:16px;line-height:1.2}
.card .cbody{font-size:9px;color:var(--dim);line-height:1.35;flex:1}
.card .cicons{margin-top:5px;font-size:11px;letter-spacing:2px;text-align:center}
.card.asset{background:linear-gradient(160deg,#152015,#0e140e);border-color:#2a4026}
.card.event{background:linear-gradient(160deg,#151a20,#0e1216);border-color:#2a3a4a}
.card.skill{background:linear-gradient(160deg,#201518,#150d10);border-color:#4a2a36}
.card.weak{background:linear-gradient(160deg,#2a1212,#1a0a0a);border-color:#5c1f1f}
/* ===== 资产 ===== */
#assets{display:flex;flex-wrap:wrap;gap:8px}
.asset-chip{display:flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:8px;padding:6px 10px;background:var(--panel2);font-size:11px}
.asset-chip.exhausted{opacity:.5}
.slots{font-size:10px;color:var(--dim);margin-top:8px}
/* ===== 按钮 ===== */
.btn{background:var(--panel2);border:1px solid var(--gold-dim);color:var(--gold);padding:7px 12px;border-radius:6px;cursor:pointer;font-size:12px;font-family:inherit;letter-spacing:1px;transition:all .15s}
.btn:hover{background:#2c2114;border-color:var(--gold);transform:translateY(-1px)}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none}
.btn.danger{border-color:var(--blood);color:#e0a0a0}
.btn.primary{background:linear-gradient(160deg,#3a2c16,#2a1e10);border-color:var(--gold)}
/* ===== 弹框 ===== */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
#modal.open{display:flex}
.modal-box{background:var(--panel);border:1px solid var(--gold-dim);border-radius:12px;padding:20px;max-width:500px;width:100%;max-height:90vh;overflow-y:auto}
.modal-box h3{color:var(--gold);font-size:16px;margin-bottom:12px;letter-spacing:1px}
.skilltest .testinfo{font-size:13px;margin-bottom:10px;line-height:1.7}
.skilltest .commits{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.commit-card{border:1px solid var(--border);border-radius:6px;padding:6px;font-size:10px;cursor:pointer;background:var(--panel2);width:86px}
.commit-card.sel{border-color:var(--gold);background:#2c2114}
.chaos{font-size:40px;text-align:center;margin:16px 0;min-height:56px}
.result-good{color:#90c090;font-weight:bold}.result-bad{color:#e08080;font-weight:bold}
.center{text-align:center}
.mb{margin-bottom:8px}
.modal-stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.modal-stat{border:1px solid var(--border);border-radius:6px;padding:6px 8px;font-size:12px;display:flex;justify-content:space-between;align-items:center}
.modal-stat .v{font-weight:bold;font-size:16px}
.modal-stat.will .v{color:#b0a0e0}.modal-stat.int .v{color:#7ab0c8}.modal-stat.combat .v{color:#d08080}.modal-stat.agility .v{color:#90c090}
/* ===== 开始界面 ===== */
#startOverlay{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;
  background-image:radial-gradient(ellipse at 50% 30%, #241a10 0%, transparent 60%)}
#startOverlay .box{max-width:600px;text-align:center;background:var(--panel);border:1px solid var(--gold-dim);border-radius:14px;padding:40px 32px}
#startOverlay h1{margin-bottom:10px;font-size:26px;color:var(--gold);letter-spacing:4px}
#startOverlay p{color:var(--dim);font-size:13px;line-height:1.8;margin-bottom:12px}
#startOverlay .btn{font-size:15px;padding:12px 30px;margin-top:8px}
</style>
</head>
<body>

<div id="startOverlay">
  <div class="box">
    <h1>聚会之夜</h1>
    <p>1926 年，马萨诸塞州阿卡姆。你的书房门被一股诡异的力量撬开，<br>黑暗中传来低语，而你握紧了手中的枪。</p>
    <p>你是<b style="color:var(--gold)">罗兰·班克斯</b>，联邦探员。今晚，你将调查这栋宅邸中不断蔓延的异象，<br>在理智崩溃之前，揭开书房、走廊与阁楼里潜藏的真相。</p>
    <p style="font-size:11px;color:var(--dim)">每回合 3 个行动 · 点击手牌打出 · 点击地点卡片移动<br>点击左侧调查员卡查看详情</p>
    <button class="btn primary" onclick="startGame()">开始调查</button>
  </div>
</div>

<div id="game" style="display:none">
  <header class="topbar">
    <div class="brand">诡镇奇谭：卡牌版<small>Arkham Horror: The Card Game · 聚会之夜</small></div>
    <div class="topstats">
      <span class="pill">回合 <b id="roundnum">1</b></span>
      <span class="pill">💰 <b id="topres">5</b></span>
      <span class="pill">🔎 <b id="topclue">0</b></span>
    </div>
  </header>

  <div id="wrap">
    <div class="phasebar" id="phasebar"></div>

    <div class="main">
      <!-- 左栏 -->
      <div class="col-left">
        <div class="panel inv-card" id="investigator" onclick="openInvestigatorModal()"></div>
        <div class="panel">
          <h2>目标进度</h2>
          <div class="aa">
            <div class="side act"><h3>幕 Act</h3><div class="txt" id="act"></div></div>
            <div class="side agenda"><h3>议程 Agenda <span class="doom" id="doomcount"></span></h3><div class="txt" id="agenda"></div></div>
          </div>
        </div>
      </div>

      <!-- 中央 -->
      <div class="col-center">
        <div class="panel">
          <h2>地图 <span class="cnt" id="locationhint"></span></h2>
          <div class="map-wrap" id="mapwrap"></div>
        </div>
        <div class="panel">
          <h2>敌人 <span class="cnt" id="enemycount"></span></h2>
          <div id="enemies"></div>
        </div>
        <div class="panel">
          <h2>行动 <span class="cnt" id="actioncount"></span></h2>
          <div class="actions" id="actions"></div>
          <div id="controls"></div>
        </div>
      </div>

      <!-- 右栏 -->
      <div class="col-right">
        <div class="panel log-panel">
          <h2>事件记录</h2>
          <div id="log"></div>
        </div>
      </div>
    </div>

    <!-- 底部：手牌 + 资产 -->
    <div class="bottom">
      <div class="panel">
        <h2>手牌 <span class="cnt" id="handcount"></span></h2>
        <div class="hand" id="hand"></div>
      </div>
      <div class="panel">
        <h2>已打出的资产 <span class="cnt">装备中</span></h2>
        <div id="assets"></div>
        <div class="slots" id="slots"></div>
      </div>
    </div>
  </div>
</div>

<div id="modal"><div class="modal-box" id="modalBox"></div></div>

<script>
/* ============ 数据定义 ============ */
const SKILL = { will:'意志', int:'智慧', combat:'战斗', agility:'敏捷' };
const SKILL_ICON = { will:'🧠', int:'🔍', combat:'💥', agility:'🏃' };

// 调查员：罗兰·班克斯
const INVESTIGATOR = {
  name:'罗兰·班克斯', title:'联邦探员', emoji:'🕵️',
  will:3, int:3, combat:4, agility:2,
  maxHp:9, maxSanity:5,
  deck:[
    {id:'p45', name:'.45 自动手枪', type:'asset', cost:3, slot:'hand', slots:1,
     text:'你的战斗行动 +1 战斗，且每次成功额外造成 1 点伤害。', icons:''},
    {id:'machete', name:'玛谢特砍刀', type:'asset', cost:3, slot:'hand', slots:1,
     text:'你的战斗行动 +1 战斗。', icons:''},
    {id:'aid', name:'紧急援助', type:'event', cost:1,
     text:'治疗 2 点伤害。', icons:''},
    {id:'resource', name:'工作动力', type:'event', cost:0,
     text:'获得 3 点资源。', icons:''},
    {id:'dodge', name:'侧身闪避', type:'event', cost:1,
     text:'本次闪避检定 +2 敏捷。', icons:''},
    {id:'courage', name:'勇气', type:'skill', cost:0,
     text:'投入战斗检定：+2 战斗。', icons:'💥💥'},
    {id:'percep', name:'感知', type:'skill', cost:0,
     text:'投入智慧检定：+2 智慧。', icons:'🔍🔍'},
    {id:'guts', name:'意外勇气', type:'skill', cost:0,
     text:'投入意志检定：+2 意志。', icons:'🧠🧠'},
    {id:'manual', name:'身手敏捷', type:'skill', cost:0,
     text:'投入敏捷检定：+2 敏捷。', icons:'🏃🏃'},
    {id:'nightmare', name:'缠身梦魇', type:'weak', cost:0,
     text:'抽到此牌时立即承受 1 点恐惧。', icons:''},
  ]
};

// 地点
const LOCATIONS = {
  study:{name:'书房', shroud:2, clues:2, desc:'你熟悉的书房，书页被风吹得哗哗作响。', conn:['hallway']},

/* ============ 状态 ============ */
let S = null;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function startGame(){
  S = {
    phase:'investigation',
    round:1,
    hp:INVESTIGATOR.maxHp, sanity:INVESTIGATOR.maxSanity,
    resources:5,
    deck:shuffle(INVESTIGATOR.deck.map(c=>({...c}))),
    hand:[], discard:[],
    assets:[],
    location:'study',
    revealed:{study:true, hallway:false, attic:false},
    locClues:{study:2, hallway:1, attic:2},
    clues:0,
    actIdx:0, agendaIdx:0, doom:0,
    enemies:[], // {card, hp, engaged, exhausted, location}
    encounter:shuffle(ENCOUNTER.map(c=>({...c}))),
    encounterDiscard:[],
    chaos:CHAOS_BAG.slice(),
    actions:3,
    gameOver:false,
    test:null,
    committed:[],
  };
  drawOpeningHand();
  document.getElementById('startOverlay').style.display='none';
  document.getElementById('game').style.display='block';
  log('<span class="narr">—— 聚会之夜：第一幕 · 书房 ——</span>','gold');
  log('你握紧配枪，踏入熟悉却异常诡异的书房。','narr');
  log('第一回合跳过神话阶段，直接进入调查阶段。','gold');
  render();
}

function drawOpeningHand(){
  while(S.hand.length < 5 && S.deck.length > 0){
    const c = S.deck.pop();
    if(c.type === 'weak'){ S.hand.push(c); break; }
    S.hand.push(c);
  }
}

/* ============ 工具 ============ */
function drawCards(n){
  for(let i=0;i<n;i++){
    if(S.deck.length===0){
      if(S.discard.length===0){ log('牌组已空，无牌可抽！','bad'); break; }
      S.deck = shuffle(S.discard); S.discard=[];
      S.sanity = Math.max(0, S.sanity-1);
      log('牌组耗尽，洗回弃牌堆，承受 1 点恐惧。','bad');
    }
    const c = S.deck.pop();
    if(c.type==='weak'){
      log('<b>缠身梦魇</b>！承受 1 点恐惧。','bad');
      S.sanity = Math.max(0, S.sanity-1);
      S.discard.push(c);
      checkDefeat();
    } else {
      S.hand.push(c);
    }
  }
}

function log(html, cls){
  const el = document.getElementById('log');
  const d = document.createElement('div');
  d.innerHTML = html;
  if(cls) d.className = cls;
  el.appendChild(d);
  el.scrollTop = el.scrollHeight;
}

function checkDefeat(){
  if(S.gameOver) return;
  if(S.hp<=0){
    log('<b>你被重伤击败！</b>','bad');
    resolve('R3','你因重伤倒在了宅邸之中，黑暗吞噬了阿卡姆。');
  } else if(S.sanity<=0){
    log('<b>你彻底疯狂！</b>','bad');
    resolve('R3','你的理智崩溃，再也无法分辨现实与幻象。');
  }
}

function renderLocations(){
  const wrap = document.getElementById('mapwrap');
  const hint = document.getElementById('locationhint');
  const ids = Object.keys(LOCATIONS);
  // 预设节点坐标（百分比定位）
  const pos = {
    study:{x:50, y:82},
    hallway:{x:50, y:50},
    attic:{x:50, y:18},
  };
  // 当前位置的相邻地点
  const current = S.location;
  const neighbors = LOCATIONS[current].conn;
  hint.textContent = `当前：${LOCATIONS[current].name} · 可前往：${neighbors.map(c=>LOCATIONS[c].name).join('、')}`;

  // 画连线（SVG）
  let svg = '<svg viewBox="0 0 100 100" preserveAspectRatio="none">';
  const drawn = new Set();
  ids.forEach(id=>{
    LOCATIONS[id].conn.forEach(c=>{
      const key = [id,c].sort().join('-');
      if(drawn.has(key)) return;
      drawn.add(key);
      const a = pos[id], b = pos[c];
      svg += `<line class="map-link" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" />`;
    });
  });
  svg += '</svg>';

  // 画节点
  let nodes = ids.map(id=>{
    const l = LOCATIONS[id];
    const p = pos[id];
    const revealed = S.revealed[id];
    const isCurrent = id===current;
    const isReachable = neighbors.includes(id) && revealed;
    const clues = S.locClues[id];
    const enemyHere = S.enemies.filter(e=>e.location===id).length;
    const cls = [];
    if(isCurrent) cls.push('current');
    if(isReachable && !isCurrent) cls.push('reachable');
    if(!revealed) cls.push('unrevealed');
    let inner = '';
    if(revealed){
      inner = `
        <span class="node-ico">${LOC_ICONS[id]||''}</span>
        <div class="node-name">${l.name}</div>
        <div class="node-sub">迷雾 ${l.shroud}</div>
        ${clues>0?`<span class="node-clue">🔎 线索 ×${clues}</span>`:''}
        ${enemyHere>0?`<span class="node-enemy">🧟 敌人 ×${enemyHere}</span>`:''}
        ${isCurrent?'<span class="you">📍 你在这里</span>':''}
      `;
    } else {
      inner = `
        <span class="node-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a7 7 0 0 0-7 7c0 5 7 11 7 11s7-6 7-11a7 7 0 0 0-7-7z"/><circle cx="12" cy="10" r="2.4"/><path d="M12 12.4V15"/><path d="M11.2 14.2l.8.8.8-.8"/></svg></span>
        <div class="node-name">未揭示</div>
        <div class="node-sub">未知地点</div>
      `;
    }
    const click = (revealed && (isReachable || isCurrent)) ? `onclick="clickNode('${id}')"` : '';
    return `<div class="map-node ${cls.join(' ')}" style="left:${p.x}%;top:${p.y}%" ${click}>
      <div class="node-card">${inner}</div>
    </div>`;
  }).join('');

  wrap.innerHTML = `<div class="map">${svg}${nodes}</div>
    <div class="legend">
      <span><span class="dot cur"></span>当前位置</span>
      <span><span class="dot reach"></span>可前往（点击移动）</span>
      <span><span class="dot unr"></span>未揭示</span>
    </div>`;
}

function clickNode(id){
  if(S.gameOver || S.phase!=='investigation') return;
  if(id===S.location) return;
  if(!LOCATIONS[S.location].conn.includes(id)) return;
  if(!S.revealed[id]) return;
  doMove(id);
}

function renderActAgenda(){
  const act = ACT_DECK[S.actIdx];

  document.getElementById('act').innerHTML = `<b>${act.id}</b> · ${act.text}`;
  document.getElementById('agenda').innerHTML = `<b>${agenda.id}</b> · ${agenda.text}`;
  document.getElementById('doomcount').textContent = agenda.threshold>0 ? `☠️ ${S.doom}/${agenda.threshold}` : '';
}

function renderActions(){
  const el = document.getElementById('actions');
  const controls = document.getElementById('controls');
  const cnt = document.getElementById('actioncount');
  if(S.gameOver){ el.innerHTML=''; controls.innerHTML=''; cnt.textContent=''; return; }
  const actions = [];
  if(S.phase==='investigation'){
    const canAct = S.actions>0;
    cnt.textContent = `剩余 ${S.actions}/3`;
    actions.push(btn('🎴 抽牌','draw',canAct,'抽 1 张牌'));
    actions.push(btn('💰 资源','resource',canAct,'+1 资源'));
    actions.push(btn('🚶 移动','move',canAct,'到相邻地点'));
    actions.push(btn('🔎 调查','investigate',canAct,'智慧 vs 迷雾'));
    actions.push(btn('💥 战斗','fight',canAct&&hasReadyLocalEnemy(),'战斗 vs 敌人'));
    actions.push(btn('🏃 闪避','evade',canAct&&hasEngagedReadyEnemy(),'敏捷 vs 闪避'));
    if(S.actIdx===0 && S.clues>=3){
      actions.push(btn('📜 推进幕','advanceAct',canAct,'花费 3 线索'));
    }
    if(S.actIdx===1 && S.location==='attic'){
      actions.push(btn('📜 完成调查','finish',canAct,'结束调查'));
    }
    controls.innerHTML = `<button class="btn" onclick="endTurn()" ${S.actions===3?'disabled':''}>结束回合 ⏭️</button>
      <span style="color:var(--dim);font-size:11px">${S.actions===3?'（至少执行 1 个行动后才能结束回合）':''}</span>`;
  } else {
    cnt.textContent = '';
    actions.push(btn('⏭️ 继续','next',true,'进入下一阶段'));
    controls.innerHTML='';
  }
  el.innerHTML = actions.join('');
}

function btn(label, fn, enabled, hint){
  return `<button class="btn action-btn" onclick="doAction('${fn}')" ${enabled?'':'disabled'}>${label}${hint?`<small>${hint}</small>`:''}</button>`;
}

function hasEngagedReadyEnemy(){
  return S.enemies.some(e=>e.engaged && !e.exhausted);
}
function hasReadyLocalEnemy(){
  return S.enemies.some(e=>e.location===S.location && !e.exhausted);
}

/* ============ 行动处理 ============ */
function doAction(fn){
  if(S.phase!=='investigation' || S.gameOver) return;
  const fnMap = {draw, resource, move, investigate, fight, evade, finish, advanceAct, next};
  if(fnMap[fn]) fnMap[fn]();
}

function spendAction(){
  S.actions--;
  render();
}

// 借机攻击：与就绪敌人交缠时，执行非豁免行动（战斗/闪避豁免）触发
function attackOfOpportunity(){
  const readyEngaged = S.enemies.find(e=>e.engaged && !e.exhausted);
  if(readyEngaged){
    takeEnemyHit(readyEngaged, '借机攻击');
    return true;
  }
  return false;
}

function takeEnemyHit(e, reason){
  log(`${e.card.name} 对罗兰发动${reason||'攻击'}：造成 ${e.card.dmg} 伤害 + ${e.card.horror} 恐惧。`,'bad');
  S.hp = Math.max(0, S.hp - e.card.dmg);
  S.sanity = Math.max(0, S.sanity - e.card.horror);
  render();
  checkDefeat();
}

/* --- 各行动 --- */
function draw(){
  attackOfOpportunity();
  drawCards(1);
  spendAction();
  log('你抽了 1 张牌。');
}

function resource(){
  attackOfOpportunity();
  S.resources++;
  spendAction();
  log('你获得 1 点资源。');
}

function move(){
  attackOfOpportunity();
  const loc = LOCATIONS[S.location];
  openModal(`
    <h3>移动到哪个地点？</h3>
    ${loc.conn.map(id=>{
      const l = LOCATIONS[id];
      const rev = S.revealed[id];
      return `<button class="btn move-btn" style="margin:5px;display:block;width:100%;text-align:left" onclick="doMove('${id}')"><span class="move-ico">${rev?(LOC_ICONS[id]||''):'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M12 3a7 7 0 0 0-7 7c0 5 7 11 7 11s7-6 7-11a7 7 0 0 0-7-7z"/><circle cx="12" cy="10" r="2.4"/></svg>'}</span>${rev?l.name:'未揭示地点'} <span style="color:var(--dim);font-size:10px">${rev?'· 迷雾 '+l.shroud:''}</span></button>`;
    }).join('')}
    <button class="btn danger" style="margin:5px;display:block;width:100%" onclick="closeModal()">取消</button>
  `);
}

function doMove(id){
  closeModal();
  S.location = id;
  if(!S.revealed[id]){
    S.revealed[id]=true;
    log(`你进入了<b>${LOCATIONS[id].name}</b>：${LOCATIONS[id].desc}`,'narr');
  } else {
    log(`你移动到<b>${LOCATIONS[id].name}</b>。`);
  }
  // 交缠的敌人跟随移动；游荡的敌人留在原地
  S.enemies.forEach(e=>{ if(e.engaged) e.location = id; });
  spendAction();
  render();
}

function investigate(){
  attackOfOpportunity();
  const loc = LOCATIONS[S.location];
  if(S.locClues[S.location]<=0){
    log('这个地点已经没有线索了。','dim');
    return;
  }
  startTest('int', loc.shroud, '调查', (success)=>{
    if(success){
      S.locClues[S.location]--;
      S.clues++;
      log(`你发现了 1 条线索！（线索 ${S.clues}）`,'good');
    } else {
      log('你没有发现任何线索。','dim');
    }
    spendAction();
    render();
  });
}

function fight(){
  // 战斗是豁免行动
  const target = S.enemies.find(e=>e.location===S.location && e.engaged && !e.exhausted)
              || S.enemies.find(e=>e.location===S.location && !e.exhausted);
  if(!target){ log('当前位置没有可攻击的敌人。','dim'); return; }
  let bonus = 0, extraDmg = 0;
  S.assets.forEach(a=>{
    if(a.card.id==='p45'){ bonus+=1; extraDmg+=1; }
    if(a.card.id==='machete'){ bonus+=1; }
  });
  const weaponTxt = bonus>0 ? `（武器修正 +${bonus}）` : '';
  startTest('combat', target.card.fight, `战斗 ${weaponTxt}`, (success)=>{
    if(success){
      let dmg = 1 + extraDmg;
      target.hp -= dmg;
      log(`你击中了 ${target.card.name}，造成 ${dmg} 点伤害！`,'good');
      if(target.hp<=0){
        log(`<b>${target.card.name} 被击败！</b>`,'gold');
        if(target.card.victory>0){
          S.clues += target.card.victory;
          log(`获得 ${target.card.victory} 点胜利线索！`,'good');
        }
        S.enemies = S.enemies.filter(e=>e!==target);
      }
    } else {
      log('你的攻击落空了。','dim');
    }
    spendAction();
    render();
  });
}

function evade(){
  // 闪避是豁免行动
  const target = S.enemies.find(e=>e.engaged && !e.exhausted);
  if(!target){ log('没有与你交缠且就绪的敌人。','dim'); return; }
  startTest('agility', target.card.evade, '闪避', (success)=>{
    if(success){
      target.exhausted = true;
      target.engaged = false;
      log(`你成功闪避了 ${target.card.name}，它被力竭并脱离。`,'good');
    } else {
      log('闪避失败，敌人仍与你交缠。','bad');
    }
    spendAction();
    render();
  });
}

function finish(){
  if(S.actIdx===1 && S.location==='attic'){
    resolve('R1','你在阁楼的旧箱中找到了真相——这场聚会背后的邪恶仪式。你决定阻止它。');
  }
}

function advanceAct(){
  attackOfOpportunity();
  if(S.actIdx!==0 || S.clues<3){ return; }
  S.clues -= 3;
  S.actIdx = 1;
  log('你花 3 条线索拼凑出真相：异象的源头在<b>阁楼</b>。','gold');
  log('<b>幕 1b</b>：前往阁楼并完成调查。','gold');
  spendAction();
  render();
}

function next(){
  advancePhase();
}

/* ============ 检定系统 ============ */
function startTest(skill, difficulty, label, onDone){
  S.test = {skill, difficulty, label, onDone, bonus:0};
  S.committed = [];
  openTestModal();
}

function openTestModal(){
  const t = S.test;
  const sk = SKILL[t.skill];
  const base = skillValue(t.skill);
  const total = base + t.bonus + S.committed.reduce((s,c)=>s+commitBonus(c),0);
  const committable = S.hand.filter(c=>commitBonus(c)>0);
  document.getElementById('modalBox').innerHTML = `
    <h3>技能检定：${t.label}</h3>
    <div class="skilltest">
      <div class="testinfo">
        ${SKILL_ICON[t.skill]} 属性：<b>${sk}</b>（基础 ${base}）<br>
        难度：<b>${t.difficulty}</b>　当前合计：<b>${total}</b>
        ${total>=t.difficulty?' <span class="result-good">(已达标)</span>':' <span class="result-bad">(未达标)</span>'}
      </div>
      <div style="font-size:11px;color:var(--dim)">投入卡牌（可选，点击选中/取消）：</div>
      <div class="commits">
        ${committable.length===0?'<div style="color:var(--dim);font-size:11px">没有可投入的牌</div>':committable.map((c)=>{
          const origIdx = S.hand.indexOf(c);
          const sel = S.committed.includes(c);
          return `<div class="commit-card ${sel?'sel':''}" onclick="toggleCommit(${origIdx})">
            <div style="font-weight:bold">${c.name}</div>
            <div style="color:var(--gold)">+${commitBonus(c)}</div>
          </div>`;
        }).join('')}
      </div>
      <div class="center mb">
        <button class="btn primary" onclick="resolveTest()">抽取混沌指示物 🎲</button>
      </div>
    </div>
  `;
  document.getElementById('modal').classList.add('open');
}

function commitBonus(c){
  const t = S.test;
  if(!t) return 0;
  if(c.type==='skill'){
    if(c.id==='courage' && t.skill==='combat') return 2;
    if(c.id==='percep' && t.skill==='int') return 2;
    if(c.id==='guts' && t.skill==='will') return 2;
    if(c.id==='manual' && t.skill==='agility') return 2;
    return 0;
  }
  if(c.type==='event' && c.id==='dodge' && t.skill==='agility') return 2;
  return 0;
}

function toggleCommit(idx){
  const c = S.hand[idx];
  if(S.committed.includes(c)){
    S.committed = S.committed.filter(x=>x!==c);
  } else {
    S.committed.push(c);
  }
  openTestModal();
}

function resolveTest(){
  const t = S.test;
  const base = skillValue(t.skill);
  let total = base + t.bonus + S.committed.reduce((s,c)=>s+commitBonus(c),0);
  const token = S.chaos[Math.floor(Math.random()*S.chaos.length)];
  let result;
  let tokenHtml;
  if(token.autofail){
    result = false; tokenHtml = '☠️';
  } else if(token.elder){
    total += 1; result = true; tokenHtml = '✨';
    S.hp = Math.min(INVESTIGATOR.maxHp, S.hp+1);
    log('✨ 上古印记：你恢复 1 点生命。','good');
  } else {
    total += token.mod; result = total >= t.difficulty; tokenHtml = token.label;
  }
  S.committed.forEach(c=>{
    S.hand = S.hand.filter(x=>x!==c);
    S.discard.push(c);
  });
  document.getElementById('modalBox').innerHTML = `
    <h3>检定结果</h3>
    <div class="chaos">${tokenHtml}</div>
    <div class="center" style="font-size:15px">
      最终技能值：<b>${total}</b> vs 难度 ${t.difficulty}<br><br>
      ${result?'<span class="result-good">✅ 检定成功</span>':'<span class="result-bad">❌ 检定失败</span>'}
    </div>
    <div class="center mb"><button class="btn primary" onclick="finishTest(${result})">确定</button></div>
  `;
  S.testResult = result;
}

function finishTest(result){
  closeModal();
  const t = S.test;
  S.test = null; S.committed=[];
  t.onDone(result);
}

function closeModal(){ document.getElementById('modal').classList.remove('open'); }
function openModal(html){ document.getElementById('modalBox').innerHTML=html; document.getElementById('modal').classList.add('open'); }

/* ============ 阶段流转 ============ */
function endTurn(){
  S.actions = 0;
  advancePhase();
}

function advancePhase(){
  if(S.gameOver) return;
  if(S.phase==='investigation'){ S.phase='enemy'; log('—— 敌人阶段 ——','gold'); enemyPhase(); }
  else if(S.phase==='enemy'){ S.phase='upkeep'; log('—— 维持阶段 ——','gold'); upkeepPhase(); }
  else if(S.phase==='upkeep'){ S.phase='mythos'; log('—— 神话阶段 ——','gold'); mythosPhase(); }
  else if(S.phase==='mythos'){ S.phase='investigation'; S.actions=3; S.round++; log(`—— 第 ${S.round} 回合 · 调查阶段 ——`,'gold'); render(); }
  render();
}

function enemyPhase(){
  // 猎手敌人移动：游荡的猎手向玩家交缠
  S.enemies.forEach(e=>{
    if(e.card.hunter && !e.engaged){
      e.engaged = true;
      e.location = S.location;
      log(`${e.card.name}（猎手）向你逼近并交缠了你！`,'bad');
    }
  });
  // 就绪且交缠的敌人攻击
  const attackers = S.enemies.filter(e=>e.engaged && !e.exhausted);
  attackers.forEach(e=>{
    takeEnemyHit(e, '攻击');
    e.exhausted = true;
  });
  render();
}

function upkeepPhase(){
  S.enemies.forEach(e=>{ e.exhausted=false; });
  S.assets.forEach(a=>a.exhausted=false);
  drawCards(1);
  S.resources++;
  log('维持阶段：恢复就绪，抽 1 张牌，+1 资源。');
  if(S.hand.length>8){
    while(S.hand.length>8){ S.discard.push(S.hand.pop()); }
    log('手牌超过 8 张，已弃置至 8 张。','dim');
  }
  render();
}

function mythosPhase(){
  S.doom++;
  log(`神话阶段：末日 +1（当前 ${S.doom}）。`,'bad');
  const agenda = AGENDA_DECK[S.agendaIdx];
  if(agenda.threshold>0 && S.doom>=agenda.threshold){
    advanceAgenda();
    render();
    return;
  }
  drawEncounter();
  render();
}

function drawEncounter(){
  if(S.encounter.length===0){
    S.encounter = shuffle(S.encounterDiscard); S.encounterDiscard=[];
  }
  const c = S.encounter.pop();
  if(c.type==='enemy'){
    const e = {card:c, hp:c.hp, engaged:true, exhausted:false, location:S.location};
    S.enemies.push(e);
    log(`遭遇：<b>${c.name}</b> 在${LOCATIONS[S.location].name}出现并交缠了你！`,'bad');
  } else if(c.type==='treachery'){
    if(c.id.startsWith('ancient')){
      S.doom++;
      log(`遭遇：<b>${c.name}</b> —— 末日 +1（当前 ${S.doom}）。`,'bad');
      const ag = AGENDA_DECK[S.agendaIdx];
      if(ag.threshold>0 && S.doom>=ag.threshold){ advanceAgenda(); }
    } else if(c.id.startsWith('whisper')){
      log(`遭遇：<b>${c.name}</b> —— 进行意志(2)检定。`,'bad');
      startTest('will', 2, '抵抗恐惧低语', (success)=>{
        if(!success){
          S.sanity = Math.max(0, S.sanity-1);
          log('你被低语侵蚀，承受 1 点恐惧。','bad');
          checkDefeat();
        } else {
          log('你稳住了心神。','good');
        }
        render();
      });
      return;
    }
    S.encounterDiscard.push(c);
  }
}

function advanceAgenda(){
  const old = AGENDA_DECK[S.agendaIdx];
  S.agendaIdx++;
  S.doom = 0;
  log(`议程推进：${old.id} → ${AGENDA_DECK[S.agendaIdx].id}`,'bad');
  const ag = AGENDA_DECK[S.agendaIdx];
  if(ag.threshold===0 && ag.id==='3a'){
    resolve('R3', ag.text.replace(/<[^>]+>/g,''));
  }
}

/* ============ 卡牌打出 ============ */
function onHandCard(i){
  if(S.phase!=='investigation' || S.gameOver) return;
  const c = S.hand[i];
  if(c.type==='skill'){ log('技能卡只能投入技能检定，无法直接打出。','dim'); return; }
  if(c.type==='weak'){ log('弱点无法主动打出。','dim'); return; }
  if(c.type==='asset'){
    const handUsed = S.assets.filter(a=>a.card.slot==='hand').length;
    if(c.slot==='hand' && handUsed>=2){
      log('手槽已满（2/2），无法再装备武器。','bad');
      return;
    }
  }
  if(S.resources < c.cost){
    log(`资源不足（需 ${c.cost}，现有 ${S.resources}）。`,'bad');
    return;
  }
  S.resources -= c.cost;
  S.hand = S.hand.filter(x=>x!==c);
  if(c.type==='asset'){
    S.assets.push({card:c, exhausted:false});
    log(`你装备了<b>${c.name}</b>（花费 ${c.cost} 资源）。`,'good');
  } else if(c.type==='event'){
    applyEvent(c);
    S.discard.push(c);
  }
  render();
}

function applyEvent(c){
  if(c.id==='aid'){
    S.hp = Math.min(INVESTIGATOR.maxHp, S.hp+2);
    log(`<b>紧急援助</b>：治疗 2 点伤害。`,'good');
  } else if(c.id==='resource'){
    S.resources += 3;
    log(`<b>工作动力</b>：获得 3 点资源。`,'good');
  } else if(c.id==='dodge'){
    log(`<b>侧身闪避</b>：下次闪避检定 +2（提示）。`,'good');
  }
}

/* ============ 结算 ============ */
function resolve(code, text){
  if(S.gameOver) return;
  S.gameOver = true;
  const win = code==='R1';
  log(`<b>${win?'✅ 达成结算 '+code+' —— 胜利':'❌ 触发结算 '+code+' —— 失败'}</b>`,'gold');
  log(text,'narr');
  document.getElementById('actions').innerHTML='';
  document.getElementById('controls').innerHTML = `<button class="btn primary" onclick="location.reload()">重新开始</button>`;
  openModal(`
    <h3>${win?'🎉 调查成功！':'💀 调查失败……'}</h3>
    <div class="center" style="font-size:13px;line-height:1.8">${text}</div>
    <div class="center mb"><button class="btn primary" onclick="closeModal()">关闭</button></div>
  `);
}
</script>
